name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Job 1: Build & Test ────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test

  # ── Job 2: Build & Push Docker Image ──────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/whatsapp-bot:latest
            ${{ secrets.DOCKER_USERNAME }}/whatsapp-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Write env file fresh on every deploy from GitHub Secrets
            cat > ~/wb.env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SUPABASE_STORAGE_URL=${{ secrets.SUPABASE_STORAGE_URL }}
            SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
            SERVER_ID=${{ secrets.SERVER_ID }}
            PORT=3000
            EOF

            docker pull ${{ secrets.DOCKER_USERNAME }}/whatsapp-bot:latest
            docker stop whatsapp-bot || true
            docker rm whatsapp-bot || true
            docker run -d \
              --name whatsapp-bot \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file ~/wb.env \
              ${{ secrets.DOCKER_USERNAME }}/whatsapp-bot:latest
